stages:
  - quality
  - security
  - ai_review

variables:
  PNPM_STORE_PATH: .pnpm-store

default:
  image: node:22-bookworm
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
      - .turbo/
  before_script:
    - corepack enable
    - corepack prepare pnpm@9.15.0 --activate
    - pnpm config set store-dir $PNPM_STORE_PATH
    - pnpm install --frozen-lockfile

quality_gate:
  stage: quality
  variables:
    # 守卫脚本要读 base...HEAD 的 diff，浅克隆下基线分支不存在
    GIT_DEPTH: '0'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
  script:
    - pnpm run ci:quality
    - pnpm run check:ui-governance
    - pnpm run test:coverage
    - pnpm run test:rules
    # 以下两项与 GitHub 的 agent-guards job 对齐，只在 MR 场景执行；
    # 用 set -e 是因为多行块里单条命令失败不会自动中止。
    - |
      set -e
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        export BASE_REF="origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
        git fetch --no-tags origin "+refs/heads/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}:${BASE_REF}"
        node scripts/agent/check-skips.mjs
        node scripts/agent/check-deps.mjs
      fi
    - pnpm check:ui-governance
    - pnpm test:coverage
    - pnpm test:rules

security_audit:
  stage: security
  script:
    - pnpm run security:audit

security_secrets:
  stage: security
  image: zricethezav/gitleaks:v8.24.2
  before_script: []
  script:
    - gitleaks detect --source . --no-banner --redact --config .gitleaks.toml

security_sast:
  stage: security
  image: semgrep/semgrep:latest
  before_script: []
  script:
    - semgrep scan --config .semgrep/rules.yml --error --exclude node_modules --exclude dist .

ai_review_baseline:
  stage: ai_review
  script:
    - test -f .ai-review/README.md
    - test -f .ai-review/frontend-review-checklist.md
    - test -f .ai-review/prompt-template.md
    - echo "AI review baseline files verified."

agent_guards:
  stage: quality
  variables:
    GIT_DEPTH: '0'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - export BASE_REF="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - export PR_LABELS="$CI_MERGE_REQUEST_LABELS"
    - node scripts/agent/check-skips.mjs
    - node scripts/agent/check-deps.mjs
